[project]
name = "q2q"
version = "0.1.0"
description = "quick2query: real-time recommender for the Datathon FME 2026 RawTree challenge"
requires-python = ">=3.12"
dependencies = ["requests>=2.32", "numpy>=2.0"]

[project.scripts]
q2q = "q2q.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
dashboard = ["streamlit>=1.40", "pandas>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/q2q"]

[tool.pytest.ini_options]
testpaths = ["tests"]
