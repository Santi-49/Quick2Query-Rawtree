[strategies.cold2]
summary = "For requests with no recent views. Best sellers × the shopper's category by rank (1 / 0.3 / 0.1) × segment; history carts ×5 (×10 if carted twice) and products viewed today ×4 once the state holds them; a viewed product only ×1.5."
status = ""
conclusion = "On all home requests since 17:25 UTC: 0.61% against 0.39% for rules2 over 500 requests each. Still far from the 2.0% reference: the home page is our weakest part."
hypotheses = ["home-ceiling", "home-personal"]

[strategies.rules4]
summary = "rules2 reading the whole session: the first recent view leads (later views, the last one included, count 5 instead of 12) and the session's category is the one with most views, not the last view's."
status = ""
conclusion = "Champion since 17:25 UTC. Led three windows on ordinary requests: 1.64%, 1.59%, 1.78% against 1.24% for rules2. Evidence: the first view gets 2.4 times the clicks of later views; a carted product outside the session category gets 5.6 times the clicks, a viewed-only one 1.0."
hypotheses = ["category-page", "session-shape", "reshow-rank", "slot-order", "view-age"]

[strategies.ranker2]
summary = "The ranker's 21 inputs plus phrase taste, session phrase overlap, carts, co-views, brand and subcategory shares, first view, main category and today's views; a click model times a purchase-given-click model."
status = ""
conclusion = "Sole challenger since 17:25 UTC. First 30 minutes: 1.94% on ordinary requests (483) against 1.78% for rules4, and 3.14% on new shoppers (222) against 2.25%. Offline: purchased product in the top 3 in 74% of held-out requests, ranker 57%. Adding history rows to its training gave no gain (H-history-pretrain)."
hypotheses = ["ml-signals", "session-shape", "reshow-rank", "home-ceiling"]
