[[backlog]]
idea = "QUEUED 1 · ranker3: retest before giving it traffic"
why = "Built and committed, not live. Offline, held out in time, it does not beat ranker2 overall (main hit3 +1.1 ± 2.2; hit10 on requests neither arm logged −4.9 ± 2.0), though it ranks today-carted purchases far better (top 3 in 73% against 46%). Its test model saw only 37 today-cart purchases; the current one saw 116. Next: add `our_clicks_today` and cart times to state.py, `train3` to cli.py, a public name; replay a window after 18:30 with `uv run eda/replay/holdout3.py 3 --refresh`; if ahead, try it live on new shoppers first. See docs/hypotheses/H-ranker3.md."
hypothesis = "gap"
size = "small, in progress"

[[backlog]]
idea = "QUEUED 2 · Are the simulator's parameters moving? (H-drift)"
why = "Santi's hypothesis: factors we treat as fixed (product appeal, category and slot multipliers, a hidden trend vector or embedding) change over the day. Hints: only 21 of 37 multipliers were stable between the two halves of the day (H-loglinear); the retrained model beats every fixed rule; the baseline moved from 0.74% to 0.41% within two hours. Tests: (1) per-product purchases per view in organic events, hour by hour: is the hour-to-hour correlation lower than sampling noise allows, and do products move together by subcategory, brand or phrase (a moving trend vector)? (2) the same in the 30-day history: daily appeal per product, autocorrelation, principal components of the changes. (3) refit the log-linear multipliers per 2-hour block and test each for a time trend. (4) replay: ranker2 trained on the last 2 hours against all of today, scored on the next 30 minutes. If drift is real: shorter training window or time-decayed weights, appeal from the last hour instead of all time, and retraining must run during the final."
hypothesis = "drift"
size = "medium"

[[backlog]]
idea = "QUEUED 3 · Retraining when the laptop is off"
why = "Training needs 890 MB and the VM has 1 GB, so with the laptop off ranker2 is frozen. If QUEUED 2 finds drift this costs score. Options: train on the VM on a sample with fewer trees, at night priority; or keep the laptop on for the final."
hypothesis = "drift"
size = "small"

