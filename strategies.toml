[strategies.cold2]
summary = "For requests with no recent views. Best sellers × the shopper's category by rank (1 / 0.3 / 0.1) × segment; history carts ×5 (×10 if carted twice) and products viewed today ×4 once the state holds them; a viewed product only ×1.5."
status = ""
conclusion = "On all home requests since 17:25 UTC: 0.61% against 0.39% for rules2 over 500 requests each. Still far from the 2.0% reference: the home page is our weakest part."
hypotheses = ["home-ceiling", "home-personal"]

[strategies.rules4]
summary = "rules2 reading the whole session: the first recent view leads (later views, the last one included, count 5 instead of 12) and the session's category is the one with most views, not the last view's."
status = ""
conclusion = "Champion since 17:25 UTC. Led three windows on ordinary requests: 1.64%, 1.59%, 1.78% against 1.24% for rules2. Evidence: the first view gets 2.4 times the clicks of later views; a carted product outside the session category gets 5.6 times the clicks, a viewed-only one 1.0."
hypotheses = ["category-page", "session-shape", "reshow-rank", "slot-order", "view-age"]

[strategies.ranker2]
summary = "The ranker's 21 inputs plus phrase taste, session phrase overlap, carts, co-views, brand and subcategory shares, first view, main category and today's views; a click model times a purchase-given-click model."
status = ""
conclusion = "Sole challenger since 17:25 UTC. First 30 minutes: 1.94% on ordinary requests (483) against 1.78% for rules4, and 3.14% on new shoppers (222) against 2.25%. Offline: purchased product in the top 3 in 74% of held-out requests, ranker 57%. Adding history rows to its training gave no gain (H-history-pretrain)."
hypotheses = ["ml-signals", "session-shape", "reshow-rank", "home-ceiling"]

[strategies.rules5]
summary = "rules4 plus the gap study: today's organic carts lead (x30 over the first view's x12), the only recent view x18, the last of several x3, product buys-per-view one power steeper, history carts by count and fewer views, no price-cut boost; home is cold2 with carts on a flatter popularity base."
status = "queued"
conclusion = "Not run live. Our feedback 14 Nov to 17:20 UTC: carted today converts 1.72% / 6.37% per weighted impression (returning / new with views) against 0.69% / 1.24% for the first view, available on 40-44% of requests, at slot 1 in 2%. Dry run on 300 live requests: 300/300 valid, 0.9 ms median, 2.1 ms p95; top 3 differs from rules4 on 262/300. Needs today's carts since the start of the day in State (H-gap next)."
hypotheses = ["gap", "home-ceiling", "reshow-rank", "session-shape"]

[strategies.ranker3]
summary = "ranker2 plus what came after it, all as of the request: today's carts (times, minutes since, same category and subcategory), our list clicked earlier today, a one-view session, distinct recent views, log appeal, log buys per view, history cart x high cart rate. Every product carted today is a candidate."
status = "queued"
conclusion = "Not run live. Trained to 18:30 UTC: 13,355 today-cart impressions, 116 purchases, so no hand prior. Newest 20%: click AUC 0.838 against 0.821 for ranker2's features, purchased product in the top 3 in 71% of 271 requests against 62%. Leak-free replay 15:32-18:32 (models fitted before it), paired against ranker2: hit3 +1.1 ± 2.2 main and +3.0 ± 3.4 new shoppers, but hit10 on requests neither logged -4.9 ± 2.0 main; on the 71 purchases of a today cart hit1 48% against 30% (rules5 72%). A x3 cart prior lifted those to 68% and cost hit3 elsewhere. 5.8 ms median on 300 live requests."
hypotheses = ["ranker3", "gap", "loglinear", "ml-signals"]

